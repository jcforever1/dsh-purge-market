name: Update market index

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - make-index.mjs
      - .github/workflows/update-index.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Regenerate the index from the upstream repository
        # The token lifts the api.github.com per-IP rate limit that shared runner
        # addresses hit. make-index.mjs also falls back to a shallow clone, so the
        # job still succeeds if the API refuses the token.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node make-index.mjs --out index.json
      - name: Commit a refreshed index
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.json
          if git diff --staged --quiet; then
            echo 'index already current'
            exit 0
          fi
          git commit -m 'chore: refresh plugin market index'
          git pull --rebase --autostash
          git push
