name: Update market index

# This repository is a compatibility alias. The canonical market index now lives with the
# plugin's mirror repository and is generated there; this workflow copies that document so
# the older URL keeps serving the same bytes.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-index.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy the canonical index from the plugin mirror
        run: |
          curl -sSfL --retry 3 --retry-delay 5 \
            https://raw.githubusercontent.com/jcforever1/dsh-purge/master/index.json \
            -o index.json
          node -e "
            const fs = require('fs');
            const doc = JSON.parse(fs.readFileSync('index.json', 'utf8'));
            if (doc.format !== 1) throw new Error('the copied document is not format 1');
            console.log('format 1, plugins:', doc.plugins.length);
          "

      - name: Commit a refreshed index
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.json
          if git diff --staged --quiet; then
            echo 'index already current'
            exit 0
          fi
          git commit -m 'chore: refresh plugin market index'
          git pull --rebase --autostash
          git push
